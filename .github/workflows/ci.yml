name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make lint

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: make test

  # Real Chrome OS cannot run in CI. This job only checks that install.sh and
  # the entry points work on other distros with CBS_ASSUME_CHROMEOS=1 and
  # --dry-run, which never calls sudo, mount, reboot or crew.
  install-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable-slim", "alpine:3"]
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install bash, curl and coreutils
        run: |
          if command -v apk >/dev/null; then
            apk add --no-cache bash curl coreutils tar
          else
            apt-get update && apt-get install -y --no-install-recommends bash curl ca-certificates
          fi
      - uses: actions/checkout@v4
      - name: Install into a temporary prefix
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)"
          echo "PREFIX=${prefix}" >> "$GITHUB_ENV"
          CBS_SUDO= bash ./install.sh --prefix "${prefix}"
          ls -la "${prefix}/bin" "${prefix}/share/chromebrew-scripts"
      - name: Run every command with --help and --dry-run --yes
        shell: bash
        env:
          CBS_ASSUME_CHROMEOS: "1"
          CBS_ROOT: /tmp/fakeroot
        run: |
          set -euo pipefail
          mkdir -p /tmp/fakeroot/etc /tmp/fakeroot/mnt/stateful_partition /tmp/fakeroot/usr/local/bin
          for cmd in chromebrew powerwash rootfs rw; do
            "${PREFIX}/bin/${cmd}" --help
            "${PREFIX}/bin/${cmd}" --version
          done
          "${PREFIX}/bin/powerwash" --dry-run --yes
          "${PREFIX}/bin/rootfs" --dry-run --yes -- --partitions 2
          "${PREFIX}/bin/rw" --dry-run --yes
          "${PREFIX}/bin/chromebrew" --status
          "${PREFIX}/bin/chromebrew" --remove --dry-run --yes
          # containers run as root and have no crew: these must refuse cleanly
          if "${PREFIX}/bin/chromebrew" --install --dry-run --yes; then exit 1; fi
          if "${PREFIX}/bin/chromebrew" --update --dry-run --yes; then exit 1; fi
      - name: Uninstall
        shell: bash
        run: |
          CBS_SUDO= bash ./install.sh --prefix "${PREFIX}" --uninstall
          test ! -e "${PREFIX}/share/chromebrew-scripts"
